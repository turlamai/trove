name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: tests
        run: |
          cd daemon && go test ./...
          cd ../frontend && npm ci --no-fund --no-audit && npm run build

      - name: extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: build package
        run: ./scripts/build.sh "${{ steps.ver.outputs.version }}"

      - name: verify checksums
        run: cd dist && shasum -a 256 --check SHA256SUMS

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          name: Trove ${{ github.ref_name }} (development preview)
          body: |
            Development preview — install only on test machines or after
            reviewing docs/safety.md. Read-only until a job data directory is
            configured (Settings → Trove).

            Verify before installing:
            `shasum -a 256 --check --ignore-missing SHA256SUMS`
          files: |
            dist/trove-*.txz
            dist/trove.plg
            dist/SHA256SUMS
          draft: false
          prerelease: true

      - name: update plugin manifest on main
        run: |
          git config user.name "trove-release-bot"
          git config user.email "bot@trove.invalid"
          cp dist/trove.plg trove.plg
          if [ -n "$(git status --porcelain trove.plg)" ]; then
            git add trove.plg
            git commit -m "release: plugin manifest ${{ github.ref_name }}"
            git push origin HEAD:main
          else
            echo "plugin manifest unchanged"
          fi
